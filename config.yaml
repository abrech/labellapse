activity_interval_seconds: 60
activity_dir: "./activity"

labels:
  - work
  - programming
  - uni
  - gaming
  - active
  - inactive
  - roochen
  - unknown

hotkeys:
  work: "ctrl+alt+w"
  programming: "ctrl+alt+p"
  uni: "ctrl+alt+u"
  gaming: "ctrl+alt+g"
  active: "ctrl+alt+h"
  inactive: "ctrl+alt+i"
  roochen: "ctrl+alt+r"
  clear: "ctrl+alt+0"

merge:
  images_dir: "./images"
  activity_dirs:
    - "./activity"
  output_dir: "./output"
  max_gap_seconds: 120
