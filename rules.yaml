default: work

# First matching label wins (top to bottom).
priority:
  - programming
  - work
  - uni
  - gaming

labels:
  programming:
    processes:
      - Code.exe
      - Cursor.exe
    titles:
      - Home Assistant
      - homeassistant.local
  work:
    processes:
      - slack.exe
      - Teams.exe
      - OUTLOOK.EXE
    titles:
      - GitHub
      - Jira
      - Outlook
  uni:
    processes:
      - anki.exe
    titles:
      - Canvas
      - Moodle
      - Coursera
      - Zoom
      - edX
      - Blackboard
      - Deep Learning
      - Universität
  gaming:
    processes:
      - steam.exe
    titles:
      - Steam
      - Counter-Strike
      - Elden Ring
      - Twitch

# Host-specific overrides. hostnames must match the machine name logged in
# activity metadata (Windows computer name, sanitized). Run record_activity.py
# once and copy the hostname from the startup log or activity JSONL.
hosts:
  - hostnames:
      - DESKTOP-HNFI54H
    default: active
    priority:
      - programming
      - work
      - uni
      - gaming
    labels:
      work:
        processes:
          - slack.exe
          - Teams.exe
          - OUTLOOK.EXE
        titles:
          - Jira
          - Outlook
